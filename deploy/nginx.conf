# /etc/nginx/sites-available/video.example.com
server {
    listen 80;
    server_name video.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name video.example.com;
    # ssl_certificate     /etc/letsencrypt/live/video.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/video.example.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live progress (Server-Sent Events): no buffering, long timeout
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # downloads can be large
    location ~ ^/api/jobs/[^/]+/download$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_max_temp_file_size 0;
    }
}
